version: '3'

services:
  clinic-api:
    build: .
    image: clinic-api
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/clinic-api
    ports:
      - '3000:3000'
    depends_on:
      - mongodb
    volumes:
      - .:/usr/src/clinic-api
    networks:
      - clinic-network

  mongodb:
    # 4.2 predates the $elemMatch and text-index behaviour this API relies on.
    image: mongo:7.0
    ports:
      - '27017:27017'
    volumes:
      - dbdata:/data/db
    networks:
      - clinic-network

volumes:
  dbdata:

networks:
  clinic-network:
    driver: bridge
