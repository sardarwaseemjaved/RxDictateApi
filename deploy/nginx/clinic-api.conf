# /etc/nginx/sites-available/clinic-api
#
# Plain HTTP on purpose: `certbot --nginx` adds the 443 block and the redirect
# itself. Replace api.example.com with the real name before running it.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Dictation audio arrives base64 inside JSON, so a segment at
    # MAX_AUDIO_UPLOAD_MB (20) is about 28 MB on the wire. nginx's default of
    # 1 MB would refuse every recording with a 413 before the API saw it.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # The API reads the client's address from these, with TRUST_PROXY=1.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A large upload from a phone on mobile data is slow.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
