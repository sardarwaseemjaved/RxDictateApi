components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: One of the fixed error codes in src/shared/errorCodes.ts
              example: RX_LOCKED
            message:
              type: string
              example: An approved prescription cannot be edited. Revise it instead.
            details:
              description: Field-by-field problems, when there are any
              nullable: true

    Success:
      type: object
      properties:
        data:
          description: The payload
        meta:
          type: object
          description: Paging and anything else that is not the payload
          nullable: true

    TokenPair:
      type: object
      properties:
        access:
          type: object
          properties:
            token:
              type: string
            expires:
              type: string
              format: date-time
        refresh:
          type: object
          properties:
            token:
              type: string
            expires:
              type: string
              format: date-time

  parameters:
    PracticeId:
      in: header
      name: X-Practice-Id
      required: true
      schema:
        type: string
      description: Required on every route except /auth
    LocationId:
      in: header
      name: X-Location-Id
      required: true
      schema:
        type: string
      description: Required on visits, prescriptions, voice, appointments and follow-ups. Optional on POST /patients, where it says where the patient was registered.

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthenticated:
      description: No access token, or one that is not valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Signed in, but not allowed to do this
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found in this practice
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
