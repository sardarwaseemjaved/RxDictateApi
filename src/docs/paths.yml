# Paths, described where a route needs more than its name to be used.
#
# Request and response bodies are zod schemas in src/shared - the contract the
# apps import - and are named here rather than copied, so there is nothing for
# this file to drift from. Every success body is { data, meta }.

paths:
  /files/{key}:
    get:
      tags: [Files]
      summary: Read a file the local storage driver holds
      description: |
        Mounted only with STORAGE_DRIVER=local; with S3 or R2 the bucket serves its own links.
        No session: the signed link is the credential. Answers with
        Cross-Origin-Resource-Policy: cross-origin, so a page can be shown in an <img>.
      security: []
      parameters:
        - { in: path, name: key, required: true, schema: { type: string } }
        - { in: query, name: expires, required: true, schema: { type: integer } }
        - { in: query, name: sig, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The file, with its Content-Type' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Files]
      summary: Upload a file to the local storage driver
      description: |
        The dev-box stand-in for a presigned S3 PUT. The URL comes from POST /reports/uploads
        (uploadUrl) and is signed over the key, the expiry, the content type (ct) and the most
        the body may weigh (size). Send the bytes as the body with Content-Type equal to ct and
        no Authorization header. Answers like a bucket: 200 with an ETag.

        An expired or altered link is FORBIDDEN. A different Content-Type, a body larger than
        size, or an empty body is VALIDATION_ERROR. Browsers need their origin in CORS_ORIGINS.
      security: []
      parameters:
        - { in: path, name: key, required: true, schema: { type: string } }
        - { in: query, name: expires, required: true, schema: { type: integer } }
        - { in: query, name: ct, required: true, schema: { type: string, enum: [image/jpeg, image/png, application/pdf] } }
        - { in: query, name: size, required: true, schema: { type: integer } }
        - { in: query, name: sig, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          application/pdf: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: 'Stored. data: { fileKey, size }'
          headers:
            ETag: { schema: { type: string }, description: 'MD5 of the bytes, quoted, as S3 gives it' }
        '400':
          {
            description: 'VALIDATION_ERROR',
            content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } },
          }
        '403': { $ref: '#/components/responses/Forbidden' }

  /reports/uploads:
    post:
      tags: [Reports]
      summary: Somewhere to PUT one report page
      description: |
        Body createUploadBodySchema { contentType, size }; data uploadTicketSchema
        { uploadUrl, fileKey, expiresAt }. PUT the bytes to uploadUrl, then pass fileKey in
        pageKeys to POST /patients/{id}/reports. With S3 or R2 uploadUrl is the bucket's;
        with the local driver it is PUT /files/{key}.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '201': { description: An upload ticket }
        '400': { description: 'VALIDATION_ERROR: a type or a size the contract does not allow' }

  /reports/{id}/review:
    post:
      tags: [Reports]
      summary: Mark a report reviewed (doctor)
      description: |
        Sets reviewedAt and reviewedBy and answers with the ReportView (reportViewSchema).
        Idempotent: reviewing again returns the report unchanged, keeping the first review.
        Audited; sends no notification. Permission report.review.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: The report }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients:
    get:
      tags: [Patients]
      summary: Search and list patients
      description: |
        Items are patientViewSchema; meta is patientListMetaSchema { page, limit, total, totalPages,
        counts { all, followUpDue, newReports } }.

        Who is in it: the doctor sees every patient of the clinic. An assistant sees the patients
        linked to a location they work at - registered there, or with a visit or an appointment
        there - and that holds for the list, the paging totals and every count. Taking a location
        off an assistant hides its patients on their next request.

        The one exception: an assistant who types a patient's whole phone number (q in E.164, exactly
        as stored) finds them wherever they were registered. For 30 minutes after, that assistant may
        open the patient and add them to a list or book them at their own location, which links the
        patient there for good. A prefix of a number finds only their own patients.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - {
            in: query,
            name: q,
            description: 'A name, an MR number, or (the start of) a phone number',
            schema: { type: string },
          }
        - { in: query, name: sort, schema: { type: string, enum: [name, lastVisit], default: name } }
        - { in: query, name: followUpDue, schema: { type: boolean, default: false } }
        - { in: query, name: newReports, schema: { type: boolean, default: false } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: One page of patients }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Patients]
      summary: Register a patient
      description: |
        Body createPatientBodySchema; data is the PatientView, with its new MR number.
        X-Location-Id is optional but read when sent, and is where the patient was registered: it
        links them to that location. Without a usable one, an assistant's patient is linked to every
        location the assistant works at, and the doctor's to the clinic's default location.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: header, name: X-Location-Id, required: false, schema: { type: string } }
      responses:
        '201': { description: The patient }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }

  /patients/{id}:
    parameters:
      - { $ref: '#/components/parameters/PracticeId' }
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Patients]
      summary: One patient
      description: |
        NOT_FOUND for a patient an assistant may not see (see GET /patients), exactly as for one that
        does not exist. The same holds wherever a patient is named by id: PATCH here, the reports
        below, GET /reports/{id}, and patientId on POST /visits, POST /appointments,
        GET /prescriptions and POST /prescriptions.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The patient }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Patients]
      summary: Correct a patient's details
      description: Body updatePatientBodySchema. NOT_FOUND as for GET.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The patient }
        '400': { description: VALIDATION_ERROR }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{id}/reports:
    parameters:
      - { $ref: '#/components/parameters/PracticeId' }
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Reports]
      summary: A patient's reports, newest test first
      description: Items are reportViewSchema. NOT_FOUND for a patient this caller may not see.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: One page of reports }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Reports]
      summary: File a report against a patient
      description: |
        Body createReportBodySchema; the pages come from POST /reports/uploads. NOT_FOUND for a
        patient this caller may not see.
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: The report }
        '400': { description: VALIDATION_ERROR }
        '404': { $ref: '#/components/responses/NotFound' }

  /reports/{id}:
    get:
      tags: [Reports]
      summary: One report, with a short-lived link per page
      description: Data is reportDetailViewSchema. NOT_FOUND when its patient is one this caller may not see.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: The report }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{id}/history:
    get:
      tags: [Patients]
      summary: A patient's timeline, newest first (doctor)
      description: |
        Visits with their vitals, prescriptions (all but cancelled), labs and reports, as
        historyItemViewSchema items discriminated by kind; meta is { page, limit, total, totalPages }.
        Practice-wide: no X-Location-Id. Permission patient.history.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: kind, schema: { type: string, enum: [visit, prescription, lab, report] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: One page of the timeline }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /visits:
    get:
      tags: [Visits]
      summary: One day's list at this location, in the order the assistant set
      description: |
        Items are visitViewSchema, sorted by queuePosition and then token. queuePosition is
        the visit's place in its day's list at its location: a number to sort by, not a count
        and not gap-free (2.5 is ordinary). A new visit starts at its token, which puts it at
        the end. The apps group the list by status and keep this order inside each group.
        date accepts the literal today, resolved against Asia/Karachi.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { $ref: '#/components/parameters/LocationId' }
        - {
            in: query,
            name: date,
            description: 'today, or a Karachi day (YYYY-MM-DD)',
            schema: { type: string, default: today },
          }
        - { in: query, name: status, schema: { type: string, enum: [waiting, with_doctor, done] } }
      responses:
        '200': { description: The list }
        '403': { $ref: '#/components/responses/Forbidden' }

  /visits/{id}/move:
    post:
      tags: [Visits]
      summary: Change who goes next (doctor, assistant)
      description: |
        Body moveVisitBodySchema { before }: the visit goes just before the visit before, or
        after every other waiting visit when before is null. Answers with the moved VisitView.
        Only waiting visits move, and only before another waiting visit on the same day at the
        same location. Moving a visit to where it already is changes nothing. The token never
        changes. Two moves of the same list at once are taken in turn, and each lands where it
        asked to. Audited as visit.move; sends no notification. Permission visit.update.

        VALIDATION_ERROR when before is the visit itself or is on another day. NOT_FOUND when
        either visit is not on this clinic's list at this location. CONFLICT when either visit
        is with the doctor or already seen (details { visitId, status }), or when another move
        of the same list held it for too long.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { $ref: '#/components/parameters/LocationId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [before]
              properties:
                before: { type: string, nullable: true, description: 'A visit id, or null for the end' }
      responses:
        '200': { description: The moved visit }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: CONFLICT }

  /prescriptions:
    get:
      tags: [Prescriptions]
      summary: Prescriptions at this location, newest first
      description: |
        Items are prescriptionListItemSchema: a PrescriptionView plus
        patient { id, name, age, sex, mrNo } (null if the patient was removed).
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { $ref: '#/components/parameters/LocationId' }
        - { in: query, name: patientId, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [draft, approved, superseded, cancelled] } }
        - {
            in: query,
            name: from,
            description: 'Karachi day, inclusive (YYYY-MM-DD)',
            schema: { type: string, format: date },
          }
        - { in: query, name: to, description: 'Karachi day, inclusive (YYYY-MM-DD)', schema: { type: string, format: date } }
        - { in: query, name: q, description: "A patient's name, phone or MR number", schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: One page of prescriptions }

  /prescriptions/from-template/{id}:
    post:
      tags: [Prescriptions, Templates]
      summary: Start a prescription from one of the doctor's templates
      description: |
        Body createFromTemplateBodySchema { patientId, visitId? }; {id} is the template.
        201 with a new draft (source template), or 200 when the visit already had an open
        draft and the template's lines were added to it - nothing already there is removed,
        and a line it already has is not added twice. Counts as a use of the template.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { $ref: '#/components/parameters/LocationId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: 'The open draft, with the template added' }
        '201': { description: A new draft from the template }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /templates:
    get:
      tags: [Templates]
      summary: The calling doctor's templates, most used first
      description: Items are templateViewSchema. Each doctor sees only their own.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: query, name: q, description: Any part of the name, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: One page of templates }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Templates]
      summary: Make a template
      description: |
        Body createTemplateBodySchema: name, plus either sections or fromPrescriptionId
        ("Save as template", from an approved prescription; its complaints, history and
        examination are left behind). The follow-up date, flags and source spans are never kept.
        CONFLICT when the doctor already has a template of that name; RX_NOT_APPROVED for a
        prescription that is not approved.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '201': { description: The template }
        '400': { description: VALIDATION_ERROR }
        '409': { description: CONFLICT or RX_NOT_APPROVED }

  /templates/{id}:
    parameters:
      - { $ref: '#/components/parameters/PracticeId' }
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Templates]
      summary: One of the doctor's templates
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The template }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Templates]
      summary: Rename it, or replace its sections
      description: Body updateTemplateBodySchema { name?, sections? }. sections replaces the whole set.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The template }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "CONFLICT - another of the doctor's templates has that name" }
    delete:
      tags: [Templates]
      summary: Delete it (soft)
      description: Answers with the template as it was.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The deleted template }
        '404': { $ref: '#/components/responses/NotFound' }

  /me:
    get:
      tags: [Me]
      summary: Who is signed in, what they practise, and every organisation they belong to
      description: |
        Needs no X-Practice-Id: its answer is what tells the app which ids exist. data is meViewSchema
        (src/shared/me.schema.ts), including specialties (SPECIALTIES in src/shared/specialties.ts).

        Each membership (membershipViewSchema) carries organisationType - clinic, platform or company -
        and can: every action its role holds, from the one table in src/core/permissions. The apps show
        and hide on can, never on role names, and the server refuses exactly what is missing from it.
        practiceId is the organisation's id and practiceName its name, whatever its type.

        A platform membership (made by yarn platform:init) has no locations, and its can holds
        settings.read and settings.platform.update and nothing of a clinic's. Sending its id as
        X-Practice-Id to any clinic route answers FORBIDDEN.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The signed-in person and their memberships }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    patch:
      tags: [Me]
      summary: Change your name or your specialties
      description: |
        Body updateMeBodySchema { name?, specialties? }. specialties replaces the whole list; each value
        is kept once, and an empty list clears it. They belong to the person, so they are the same in
        every clinic. The letterhead's speciality line is separate and stays as typed. Audited in every
        organisation the person is active in.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: The same shape as GET /me }
        '400': { description: VALIDATION_ERROR - for example a specialty not in the list }

  /locations:
    post:
      tags: [Locations]
      summary: Add a location (doctor)
      description: |
        Body createLocationBodySchema. Besides the letterhead fields, province (PROVINCES in
        src/shared/location.schema.ts, or null) and city (free text, stored trimmed and in title case,
        so "lahore" is saved as "Lahore"; blank is null), which later features match on.
        PATCH /locations/{id} takes the same fields, each optional, and changes only the ones sent.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '201': { description: The location (locationViewSchema), with province and city }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings:
    get:
      tags: [Settings]
      summary: Every setting, as it applies to you in this organisation
      description: |
        For any member of any kind of organisation (permission settings.read). X-Practice-Id says
        which membership is asking. data is settingsViewSchema (src/shared/settings.ts): every key in
        the registry, each as { value, source, locked }.

        source is where the value came from: user (your own, in this organisation), organisation
        (this clinic's), platform (RxDictate's, for everyone) or default (nobody set it). The server
        works it out: your own value, unless a layer above locked it, then the organisation's, then
        the platform's, then the registry's default. A lock beats every layer below it, and locked is
        true when one decided the value. A value the registry no longer accepts counts as unset.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '200':
          description: Every setting
          content:
            application/json:
              example:
                data: { medicines.source: { value: myList, source: organisation, locked: true } }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings/me:
    patch:
      tags: [Settings]
      summary: Set or take away your own values
      description: |
        Body updateUserSettingsBodySchema (SettingsPatch) { values: [{ key, value }] }. A value sets yours; null takes it away, so what
        applies above shows through. A list rather than an object keyed by setting, because a setting's
        key has a dot in it and the API strips dotted keys from request bodies.

        VALIDATION_ERROR, with details against each change (body.values.N.key or .value), for a key
        that is not in the registry, one a person may not set for themselves, one named twice, a
        value its schema refuses, and a key a layer above has locked ("is locked by your clinic").
        Taking your value away is allowed under a lock. Answers with GET /settings's shape.
        Audited when something changed, and sends settings over the realtime socket to your own
        sockets in this organisation.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      requestBody:
        content:
          application/json:
            example: { values: [{ key: medicines.source, value: all }] }
      responses:
        '200': { description: Every setting, as it now applies to you }
        '400': { description: VALIDATION_ERROR }

  /settings/organisation:
    patch:
      tags: [Settings]
      summary: Set, lock or take away the clinic's values (by key)
      description: |
        Each key names the action that sets it (organisationAction in the registry, otherwise
        settings.organisation.update), and one key the caller may not set refuses the whole patch with
        FORBIDDEN: medicines.source is drugList.clinic.manage, so a medicine manager can set that and
        nothing else. Body { values: [{ key, value, locked? }] }. locked: true stops the people in the clinic changing it, on a key the registry
        marks lockable; leaving locked out keeps the lock as it was. value null takes the clinic's value
        and its lock away. Refused as for /settings/me, plus a lock on a key that is not lockable, and
        a key RxDictate has locked ("is locked by RxDictate"). Sends settings to everyone in the clinic.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      requestBody:
        content:
          application/json:
            example: { values: [{ key: medicines.source, value: myList, locked: true }] }
      responses:
        '200': { description: Every setting, as it now applies to the caller }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }

  /settings/platform:
    patch:
      tags: [Settings]
      summary: Set, lock or take away a value for every organisation (platform admin)
      description: |
        Permission settings.platform.update: a platformAdmin, with the platform's id as X-Practice-Id.
        The same body as /settings/organisation. A platform lock beats every clinic's value and every
        person's. Sends settings to every open socket.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '200': { description: Every setting, as it now applies to the caller }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drugs:
    get:
      tags: [Medicines]
      summary: Suggestions, by the caller's medicines.source (doctor, medicine manager)
      description: |
        The server applies the caller's effective medicines.source; the app only sends what was typed.
        myList searches the doctor's list and the clinic's, what they have used first. myListFirst
        searches everything: the doctor's list, then the clinic's, then the rest. all searches every
        active national medicine and the clinic's items: the doctor's list, then their use, then the
        clinic's, then the rest. Inside a tier, a name (brand, composition or alias) that starts with q
        comes before one with a later word starting with it, then the doctor's usage, then the alphabet.
        Never another clinic's items, another doctor's typed rows, or anything that isn't active, and
        nothing paid or promoted, ever.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: query, name: q, required: true, schema: { type: string, minLength: 1, maxLength: 120 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - in: query
          name: everywhere
          description: Search as all for this one request. Never changes the setting.
          schema: { type: string, enum: ['true', 'false'], default: 'false' }
      responses:
        '200': { description: A list of DrugSuggestion, which is DrugView plus inMyList, inClinicList and usual }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Medicines]
      summary: Add a medicine for the clinic's list or the doctor's own
      description: |
        Body createDrugBodySchema. for clinic makes a clinic row on the clinic's list, and needs
        drugList.clinic.manage. for me makes a doctor row (typed, unverified) on the doctor's own list,
        and needs drugList.own.manage. An exact duplicate the caller can already see, ignoring case and
        spacing, is reused and put on that list, and answers 200. Sends medicines.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      requestBody:
        content:
          application/json:
            example:
              { brand: Local Syrup, generic: Honey, strength: 5ml, form: syp, pack: 100ml, company: House, for: clinic }
      responses:
        '201': { description: Made. A DrugListItemView }
        '200': { description: An existing medicine was reused. A DrugListItemView }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drugs/{id}:
    patch:
      tags: [Medicines]
      summary: Correct a clinic's item or a doctor's own row
      description: |
        Body updateDrugBodySchema; only what is sent changes. A clinic row may be corrected by anyone
        with drugList.clinic.manage, and a doctor row only by its doctor. A national row is FORBIDDEN:
        the catalog comes from the import. Correcting a row into one the owner already has is CONFLICT.
        Sends medicines.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: The medicine (DrugView) }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: NOT_FOUND, including a row the caller cannot see }
        '409': { description: CONFLICT }

  /drug-lists/{owner}:
    parameters:
      - in: path
        name: owner
        required: true
        description: me, the caller's own list in this clinic, or clinic. No route names another doctor's list.
        schema: { type: string, enum: [me, clinic] }
    get:
      tags: [Medicines]
      summary: A page of a list, by brand (doctor, medicine manager)
      description: Permission drugList.read. A discontinued drug stays listed, shown as discontinued, so its owner can take it off.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 'A page of DrugListItemView: { drug, usual, addedAt }, with paging in meta' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /drug-lists/{owner}/items/{drugId}:
    parameters:
      - { in: path, name: owner, required: true, schema: { type: string, enum: [me, clinic] } }
      - { in: path, name: drugId, required: true, schema: { type: string } }
    put:
      tags: [Medicines]
      summary: Add a drug to a list, or update its usual
      description: |
        me needs drugList.own.manage and clinic needs drugList.clinic.manage. Body { usual? }: leaving
        it out keeps what is there, null takes it away, and a usual keeps only what was sent. Sending it
        twice changes nothing and writes nothing. May go on a list: an active national drug, the clinic's
        own items, and on a doctor's own list their own typed rows. Sends medicines.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      requestBody:
        content:
          application/json:
            example: { usual: { pattern: { m: 1, a: 0, n: 1 }, timing: after_meal, durationDays: 5 } }
      responses:
        '200': { description: The item (DrugListItemView) }
        '400': { description: VALIDATION_ERROR, for a discontinued drug or a doctor's own row on the clinic's list }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: NOT_FOUND, including a row the caller cannot see }
    delete:
      tags: [Medicines]
      summary: Take a drug off a list
      description: The same permissions as PUT. Taking off what is not there writes nothing. The drug stays in the catalog.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '200': { description: '{ removed: boolean }' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /members:
    get:
      tags: [Team]
      summary: An organisation's own staff (a clinic's doctor, a company's admin, a platform admin)
      description: |
        Serves every kind of organisation; X-Practice-Id says which. A clinic answers exactly as before.
        A company or the platform answers its own members, with locationIds always empty.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: query, name: status, schema: { type: string, enum: [active, removed] } }
      responses:
        '200': { description: 'A list of memberViewSchema' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Team]
      summary: Add a member by phone number (doctor, companyAdmin, platformAdmin)
      description: |
        In a clinic: body addMemberBodySchema. role is doctor, pa (the default) or medicineManager.
        locationIds is required, except for a medicine manager, who reaches every location like a doctor
        and holds only the medicine actions. A medicine manager's role never changes.

        In a company or the platform: body addOrganisationMemberBodySchema, with one of that
        organisation's roles (companyAdmin or companyEditor; platformAdmin, reviewer or contentManager)
        and no locations. A role from another kind of organisation is VALIDATION_ERROR. The person is
        told by SMS, naming the organisation. Roles never change: remove the member and add them again.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '201': { description: The member (memberViewSchema) }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: ALREADY_MEMBER }

  /members/{id}:
    patch:
      tags: [Team]
      summary: A clinic member's role between doctor and pa, their locations, or their name (doctor)
      description: |
        A clinic's only. A company's or the platform's roles never change, so this is FORBIDDEN there.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: The member (memberViewSchema) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: LAST_DOCTOR }
    delete:
      tags: [Team]
      summary: Remove a member (doctor, companyAdmin, platformAdmin)
      description: |
        Sets the membership to removed. A clinic keeps at least one doctor (LAST_DOCTOR); a company or
        the platform keeps at least one admin (LAST_ADMIN). Another organisation's member is NOT_FOUND.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: The member, now removed (memberViewSchema) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: LAST_DOCTOR or LAST_ADMIN }

  /companies:
    get:
      tags: [Companies]
      summary: Medicine companies, paged (platformAdmin, reviewer)
      description: |
        The platform organisation only. By name; q matches anywhere in the name, ignoring case.
        meta is { page, limit, total, totalPages }.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string, enum: [active, suspended] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 'A list of companyViewSchema' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Companies]
      summary: Make a company and invite its first admin (platformAdmin)
      description: |
        Body createCompanyBodySchema. Makes an organisation of type company, and gives admin.phone a
        companyAdmin membership, making the user if nobody has signed in with that number, and sending
        an SMS that names the company. That admin then adds the company's own staff at /members. One
        company per SECP registration number: a second is CONFLICT.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      requestBody:
        content:
          application/json:
            example:
              name: Zenith Labs
              address: 12 Industrial Estate
              province: punjab
              city: Lahore
              secpRegNo: '0123456'
              drapLicenceNo: DML-000123
              contactPhone: '+924235550000'
              admin: { phone: '+923001234567', name: Hina Shah }
      responses:
        '201': { description: The company (companyViewSchema) }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: CONFLICT, the SECP number is another company's }

  /companies/{id}:
    parameters:
      - { $ref: '#/components/parameters/PracticeId' }
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Companies]
      summary: One company (platformAdmin, reviewer)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: companyViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Companies]
      summary: Edit a company's details (platformAdmin)
      description: Body updateCompanyBodySchema; only what is sent changes. Status changes only through suspend and reactivate.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: companyViewSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: CONFLICT, the SECP number is another company's }

  /companies/{id}/suspend:
    post:
      tags: [Companies]
      summary: Suspend a company (platformAdmin)
      description: |
        Its members are refused on every route, and on the socket, with ORGANISATION_SUSPENDED, and
        their open apps are closed. Its pending submissions wait: a reviewer cannot decide them until it
        is reactivated. Its live products stay, because doctors already rely on them. Doing it twice
        changes nothing.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: companyViewSchema, status suspended }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /companies/{id}/reactivate:
    post:
      tags: [Companies]
      summary: Reactivate a suspended company (platformAdmin)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: companyViewSchema, status active }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /company:
    get:
      tags: [Company portal]
      summary: The caller's own company (companyAdmin, companyEditor)
      description: X-Practice-Id is the company's id. A suspended company answers ORGANISATION_SUSPENDED here and on every company route.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '200': { description: companyViewSchema }
        '403': { description: 'FORBIDDEN, or ORGANISATION_SUSPENDED' }

  /company/products:
    get:
      tags: [Company portal]
      summary: The company's live products, each with its latest submission (companyAdmin, companyEditor)
      description: |
        Only rows this company owns: its approved products and the DRAP rows it claimed. Never usage,
        and never who prescribes them. What is still in review is in GET /submissions.
        latestSubmission is the newest of the company's own submissions that names the product or made it.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: query, name: q, schema: { type: string, maxLength: 120 } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 'A list of companyProductViewSchema' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Company portal]
      summary: Send a new product for review (drug.create)
      description: |
        Body createProductBodySchema: the DRAP importer's columns, with form as one of ours. Nothing is
        live until a reviewer approves it. A registration number already in the catalog is CONFLICT:
        details.drugId names the row, and details.claimable says to claim it instead. One already waiting
        for review is CONFLICT too.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      requestBody:
        content:
          application/json:
            example:
              { brand: Zentra, composition: Zentramol 250mg, strength: 250mg, form: tab, pack: 10x10, registrationNo: '012345' }
      responses:
        '201': { description: 'The submission, as GET /submissions/{id} shows it (submissionDetailViewSchema)' }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: CONFLICT }

  /company/products/claim:
    post:
      tags: [Company portal]
      summary: Claim a DRAP-imported product by its registration number (drug.claim)
      description: |
        Body claimProductBodySchema. Approved, the company owns that row: its id, every list holding it
        and all its usage stay as they are, and its company text becomes the company's name. A row that
        is already this company's, or another company's, is CONFLICT; a number not in the catalog is
        NOT_FOUND. The claim takes the row as it is; send changes once it is approved.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '201': { description: submissionDetailViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: CONFLICT }

  /company/products/csv/check:
    post:
      tags: [Company portal]
      summary: Check a CSV of products, changing nothing
      description: |
        Body companyCsvBodySchema: the file's text as csv, in the JSON body (500 rows are far under the
        API's JSON limit). Columns registrationNo, brand, composition, strength, form, pack, in any
        order; a company column is ignored. At most 500 rows. Each row says what it would become: new,
        update (one of this company's products), claim (a DRAP row nobody owns) or unchanged, or its
        problems. A missing column, no rows, or more than 500 is VALIDATION_ERROR for the whole file.
        Problems are plain sentences to show as they are, such as "Enter the brand name".
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '200': { description: csvCheckViewSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }

  /company/products/csv:
    post:
      tags: [Company portal]
      summary: Send a CSV of products, one submission per row
      description: |
        The same body and rules as the check. A file with any problem sends nothing (VALIDATION_ERROR,
        with each row's problems in details). Otherwise each new, update and claim row becomes its own
        submission, all sharing an uploadId that GET /submissions?uploadId= filters on. Unchanged rows
        send nothing.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '201': { description: csvSendViewSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }

  /company/products/{id}:
    patch:
      tags: [Company portal]
      summary: Send a change to one of the company's products (drug.update)
      description: |
        Body updateProductBodySchema; only what is sent, and only what differs, is in the payload. What
        doctors see stays as it is until it is approved. One change or discontinuation at a time per
        product (CONFLICT). Another company's product is NOT_FOUND.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '201': { description: submissionDetailViewSchema; current is the live row as it is now }
        '400': { description: VALIDATION_ERROR, including a change that changes nothing }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: CONFLICT }

  /company/products/{id}/discontinue:
    post:
      tags: [Company portal]
      summary: Send a discontinuation of one of the company's products (drug.discontinue)
      description: Approved, the product is discontinued, and stays on every list marked so.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '201': { description: submissionDetailViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: CONFLICT, already discontinued or a change is waiting }

  /drugs/{id}/propose:
    post:
      tags: [Medicines]
      summary: Offer one of the clinic's own items to the national catalog (doctor, medicine manager)
      description: |
        A drug.propose submission, sent as the item stands now. Nothing changes until a reviewer
        publishes it (the same id becomes national, so every list keeps it) or merges it into an
        existing national row (lists and usage move there, and the item is retired as discontinued).
        Prescriptions never change. A doctor's own row, or another clinic's, is NOT_FOUND. One already
        open is CONFLICT. GET /drug-lists/clinic shows the latest proposal beside each item.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '201': { description: submissionViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: CONFLICT }

  /submissions:
    get:
      tags: [Review]
      summary: The review queue (reviewer), or the caller's own organisation's submissions (company, clinic)
      description: |
        A reviewer sees every organisation's and may filter by organisationId; a company or a clinic sees
        only its own, and organisationId is ignored. With no status, open ones come first (pending, then
        changesRequested, then the rest), each oldest sent first. Types are drug.create, drug.update,
        drug.discontinue, drug.claim and drug.propose.
        Each view's subject names what it is about for a list row ({ brand, strength }): a new product
        from its payload, anything else from the row drugId names, as it is now. Null only when there
        is nothing to name it by.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: query, name: status, schema: { type: string, enum: [pending, approved, rejected, changesRequested, withdrawn] } }
        - in: query
          name: type
          schema: { type: string, enum: [drug.create, drug.update, drug.discontinue, drug.claim, drug.propose] }
        - { in: query, name: organisationId, schema: { type: string } }
        - { in: query, name: uploadId, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 'A list of submissionViewSchema' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /submissions/{id}:
    parameters:
      - { $ref: '#/components/parameters/PracticeId' }
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Review]
      summary: One submission, with the live row to compare it with and, for a reviewer, likely duplicates
      description: |
        current is the row as it is now, for an update, discontinuation, claim or proposal. duplicates,
        for a reviewer only, are national rows with the same registration number, or the same brand,
        strength and form among active ones. A sender never sees who reviewed (reviewerId and the
        reviewer's history steps have by null). Another organisation's is NOT_FOUND.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: submissionDetailViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Review]
      summary: Send one back for changes again, edited (company, clinic)
      description: |
        Body resubmitSubmissionBodySchema. Only a changesRequested one; it goes back to pending as the
        same submission, its history kept. payload replaces the one before and is checked as if sent
        fresh. A proposal takes no payload: correct the item with PATCH /drugs/{id}, then send this.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: submissionViewSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: SUBMISSION_WRONG_STATUS, or CONFLICT }

  /submissions/{id}/withdraw:
    post:
      tags: [Review]
      summary: Take back an open submission (company, clinic)
      description: Pending or changesRequested only. A withdrawn one can never be approved.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: submissionViewSchema }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: SUBMISSION_WRONG_STATUS }

  /submissions/{id}/approve:
    post:
      tags: [Review]
      summary: Approve, which does what the type means (platformAdmin, reviewer)
      description: |
        Body approveSubmissionBodySchema. Pending only (SUBMISSION_WRONG_STATUS otherwise, with
        details.status). A suspended sender's waits (ORGANISATION_SUSPENDED).

        - drug.create: a national, active row, source company, owned by the company and under its name.
          A registration number in the catalog by now is CONFLICT: reject it as a duplicate instead.
        - drug.update: the live row changes now.
        - drug.discontinue: status discontinued.
        - drug.claim: the company owns the DRAP row; its id, lists and usage are unchanged.
        - drug.propose: decision is required. publish makes the clinic's row national with the same id.
          merge needs intoDrugId, an active national row: the clinic's and its doctors' list items and
          usage move there, and the clinic's row is discontinued, pointing at it. Prescriptions never change.

        If carrying it out fails, it stays pending.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            example: { decision: merge, intoDrugId: 6540000000000000000000aa }
      responses:
        '200': { description: submissionViewSchema, with resultDrugId }
        '400': { description: VALIDATION_ERROR }
        '403': { description: 'FORBIDDEN, or ORGANISATION_SUSPENDED' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'SUBMISSION_WRONG_STATUS, or CONFLICT when the row has changed since it was sent' }

  /submissions/{id}/reject:
    post:
      tags: [Review]
      summary: Reject, with a note the sender reads (platformAdmin, reviewer)
      description: |
        Body rejectSubmissionBodySchema; note is required. On a new product already in the catalog,
        duplicateOfId names that national row, so the company can claim it instead.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: submissionViewSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { description: 'FORBIDDEN, or ORGANISATION_SUSPENDED' }
        '409': { description: SUBMISSION_WRONG_STATUS }

  /submissions/{id}/request-changes:
    post:
      tags: [Review]
      summary: Send it back to be edited, with a note the sender reads (platformAdmin, reviewer)
      description: Body requestChangesBodySchema; note is required.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: submissionViewSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { description: 'FORBIDDEN, or ORGANISATION_SUSPENDED' }
        '409': { description: SUBMISSION_WRONG_STATUS }

  /portal/links/preview:
    post:
      tags: [Portal]
      summary: See whose record a code points at, changing nothing
      description: |
        Sign-in and no X-Practice-Id. Checks everything linking would: the signed-in phone equals
        the record's, the code is valid, the clinic's portal is on, and the record isn't blocked,
        deleted or linked to somebody else. A phone match alone never links anything.

        Every failure is the same PORTAL_LINK_FAILED, so nothing says whether a record exists.
        Shares PORTAL_LINK_RATE_LIMIT_MAX tries a minute per person with POST /portal/links.

        Body portalLinkBodySchema (src/shared/portal.schema.ts): `kind` is `invite` or `prescription`,
        and `code` is an invite's code, or the verification code of an approved or superseded
        prescription. Answers portalLinkPreviewSchema: the clinic's name, and the patient's name,
        age and sex.
      responses:
        '200': { description: 'Whose record it is' }
        '400': { description: 'PORTAL_LINK_FAILED, or VALIDATION_ERROR for a missing kind or code' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { description: RATE_LIMITED }
  /portal/links:
    post:
      tags: [Portal]
      summary: Link a patient record to this account
      description: |
        The same body and checks as the preview. 201 for a new link. 200 when it was already this
        person's, or when a new code revived their dormant link. Using an invite consumes it. A link
        is not a membership and gives no clinic rights.
      responses:
        '200': { description: 'Already theirs, or revived: portalLinkViewSchema' }
        '201': { description: 'A new link: portalLinkViewSchema' }
        '400': { description: 'PORTAL_LINK_FAILED, or VALIDATION_ERROR for a missing kind or code' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { description: RATE_LIMITED }
    get:
      tags: [Portal]
      summary: This person's links
      description: |
        Each with the patient, the clinic and a status: `active`; `dormant`, unused for 180 days and
        needing a new code; or `unavailable`, the clinic's portal being off, which turning it on
        restores. Removed links aren't listed.
      responses:
        '200': { description: 'A list of portalLinkViewSchema' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /portal/links/{linkId}:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string } }
    delete:
      tags: [Portal]
      summary: Remove your own link
      description: Works on a dormant or unavailable link too. Someone else's, or one already removed, is NOT_FOUND.
      responses:
        '200': { description: '{ removed: true }' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/links/{linkId}/prescriptions:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string } }
    get:
      tags: [Portal]
      summary: This record's approved and superseded prescriptions, newest first
      description: |
        Paged. Never a draft or a cancelled one. A superseded one has `replacedBy`, naming the approved
        version that stands now. On this and every route under a link: someone else's or a removed link
        is NOT_FOUND, and the caller's own that can't serve right now (dormant, or the portal off) is
        PORTAL_LINK_UNAVAILABLE.
      responses:
        '200': { description: 'A page of portalPrescriptionListItemSchema' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { description: PORTAL_LINK_UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/links/{linkId}/prescriptions/{id}:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string } }
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Portal]
      summary: One prescription as printed
      description: From the letterhead snapshot, with its verification code. No edit log, flags, spans or internal ids.
      responses:
        '200': { description: portalPrescriptionViewSchema }
        '403': { description: PORTAL_LINK_UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/links/{linkId}/prescriptions/{id}/pdf:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string } }
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Portal]
      summary: A short-lived link to the print file
      responses:
        '200': { description: portalFileLinkSchema }
        '403': { description: PORTAL_LINK_UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/links/{linkId}/reports:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string } }
    get:
      tags: [Portal]
      summary: This record's reports
      responses:
        '200': { description: 'A page of portalReportViewSchema' }
        '403': { description: PORTAL_LINK_UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Portal]
      summary: File a report the patient has uploaded
      description: |
        Step two: the pages are already in storage. Lands in the clinic's inbox unreviewed, with
        `source: 'patient'`, and reaches staff through the `reports` topic. Each `pageKeys` value must be
        one issued to this link by POST .../uploads; any other is VALIDATION_ERROR. On the staff view,
        `uploadedBy` is the account holding the link, which is not a member of the clinic.
      responses:
        '201': { description: portalReportViewSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { description: PORTAL_LINK_UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/links/{linkId}/reports/{id}:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string } }
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Portal]
      summary: One report, with a short-lived link per page
      responses:
        '200': { description: portalReportDetailViewSchema }
        '403': { description: PORTAL_LINK_UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/links/{linkId}/uploads:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string } }
    post:
      tags: [Portal]
      summary: Somewhere to PUT one page
      description: Step one of an upload, with the limits in REPORT_UPLOAD. The key it answers with is good for this link alone.
      responses:
        '201': { description: uploadTicketSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { description: PORTAL_LINK_UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/links/{linkId}/appointments:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string } }
    get:
      tags: [Portal]
      summary: This record's appointments
      parameters:
        - { in: query, name: when, schema: { type: string, enum: [upcoming, past] }, description: 'Left out, both, newest first. upcoming runs soonest first.' }
        - { in: query, name: includeCancelled, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 'A page of portalAppointmentViewSchema' }
        '403': { description: PORTAL_LINK_UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/links/{linkId}/follow-ups:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string } }
    get:
      tags: [Portal]
      summary: When the doctor asked this patient back
      responses:
        '200': { description: 'A page of portalFollowUpViewSchema' }
        '403': { description: PORTAL_LINK_UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
  /portal/links/{linkId}/vitals:
    parameters:
      - { in: path, name: linkId, required: true, schema: { type: string } }
    get:
      tags: [Portal]
      summary: Readings over time, from finished visits, newest first
      responses:
        '200': { description: 'A page of portalVitalsViewSchema' }
        '403': { description: PORTAL_LINK_UNAVAILABLE }
        '404': { $ref: '#/components/responses/NotFound' }
  /patients/{id}/portal:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Patients]
      summary: A patient's online access, as the clinic sees it
      description: |
        patientPortalViewSchema: `status` is none, invited, linked or dormant, with `invitedAt`, `linkedAt`,
        `blocked`, and `available`, which says the clinic's portal is on and the record has a phone. Never says
        which account holds the link. Doctor and assistant; a patient outside an assistant's locations is
        NOT_FOUND, and a medicine manager is FORBIDDEN.
      responses:
        '200': { description: patientPortalViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Patients]
      summary: Don't share online
      description: |
        `{ blocked: boolean }`. Turning it on ends any link and any unused invite. Turning it off brings neither
        back: the patient needs a code again.
      responses:
        '200': { description: patientPortalViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /patients/{id}/portal/invite:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [Patients]
      summary: Send an invite by SMS
      description: |
        A one-time code, expiring after 30 days, replacing any before it. The SMS links at
        {INVITE_BASE_URL}/{code}, and names the clinic and the doctor, never the patient, a medicine or a
        diagnosis. The code is never in a response. A failed SMS doesn't fail this.
      responses:
        '200': { description: patientPortalViewSchema }
        '400': { description: 'VALIDATION_ERROR: the record has no phone' }
        '403': { description: 'FEATURE_DISABLED: the portal is off. FORBIDDEN: a medicine manager' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'CONFLICT: blocked, or already linked' }
        '429': { description: 'PORTAL_INVITE_TOO_SOON: one per record per 24 hours. details.retryAt says when' }
  /patients/{id}/portal/link:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string } }
    delete:
      tags: [Patients]
      summary: Remove the patient's link
      description: Nothing to remove answers the same, so a double tap isn't an error.
      responses:
        '200': { description: patientPortalViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /verify/{code}:
    parameters:
      - in: path
        name: code
        required: true
        description: The last part of the link in a printout's QR code. 22 characters of base64url.
        schema: { type: string, pattern: '^[A-Za-z0-9_-]{22}$' }
    get:
      tags: [Verify]
      summary: Check a printed prescription against what the doctor approved
      description: |
        Public and permanent: no sign-in, no X-Practice-Id, no expiry. A pharmacist reaches it by
        scanning the printout's QR code, which opens the web app's /v/{code} page, which reads this.

        Answers verifyViewSchema (src/shared/verify.schema.ts): status, the Rx ID, when it was
        approved, the doctor and clinic as printed, the medicines, and a patient line of initials,
        age and sex. Never the patient's name, phone or MR number, and never the diagnosis,
        complaints, history, examination, labs, diet or advice.

        A superseded prescription answers status `replaced`, with `replacedBy` naming the approved
        version that stands now, and no medicines. While a revision is still a draft, the original
        answers `valid`.

        An unknown or malformed code, or one on a draft or cancelled prescription, all answer the
        same NOT_FOUND. Shares a limit of 30 requests a minute per address with the QR image. A read
        writes no audit row, and the request log keeps only the first four characters of the code.
      security: []
      responses:
        '200':
          description: The prescription as approved
          content:
            application/json:
              example:
                data:
                  status: valid
                  number: RX-2026-000418
                  approvedAt: '2026-11-01T09:12:44.000Z'
                  doctor:
                    {
                      name: Dr Shakeel Ahmed,
                      qualifications: [MBBS, FCPS],
                      speciality: Consultant Physician,
                      pmdcNo: '12345-P',
                    }
                  clinic: { name: Health Care, address: 'I-8/2, Islamabad' }
                  patient: { initials: M. K., age: 52, sex: male }
                  medicines:
                    - name: Omeprazole
                      strength: 20mg
                      form: cap
                      route: oral
                      pattern: { m: 1, a: 0, n: 0 }
                      timing: before_meal
                      durationDays: 14
                      instructionEn: ''
                      instructionUr: ''
                  replacedBy: null
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: RATE_LIMITED - more than 30 verify requests a minute from this address }

  /verify/{code}/qr.svg:
    parameters:
      - { in: path, name: code, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{22}$' } }
    get:
      tags: [Verify]
      summary: The QR code a printout shows, as an SVG
      description: |
        Public, like the page. The QR of prescription.verification.url, at error correction level M
        and with no quiet zone, because the printout leaves its own space. No width or height: size
        it where it is shown. Cache-Control: public, max-age=31536000, immutable, and
        Cross-Origin-Resource-Policy: cross-origin so the web app can show it in an <img>.

        The path is verifyQrPath(code) in src/shared/verify.schema.ts. Same limit as the page.
      security: []
      responses:
        '200':
          description: The QR image
          content:
            image/svg+xml: { schema: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { description: RATE_LIMITED }

  /announcements:
    get:
      tags: [Announcements]
      summary: The console's announcements, newest first (platform admin, content manager)
      description: |
        Filter by status (draft, published, withdrawn), kind (seminar, event, update, product) and
        sponsorId (a company's id, or none for RxDictate's own). Each is announcementViewSchema;
        ended is true for a published one whose window has passed.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: query, name: status, schema: { type: string, enum: [draft, published, withdrawn] } }
        - { in: query, name: kind, schema: { type: string, enum: [seminar, event, update, product] } }
        - { in: query, name: sponsorId, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 'A list of announcementViewSchema' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Announcements]
      summary: A new announcement, as a draft (platform admin, content manager)
      description: |
        Body createAnnouncementBodySchema. A seminar or an event needs event (startsAt, and a place or
        an online link); register and addToCalendar are only for those. A product needs drugId (an
        active national medicine) and sponsorId (a company). imageKey must come from
        POST /announcements/images. An audience's organisationIds must be clinics. Nobody outside the
        console sees a draft.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '201': { description: announcementViewSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }

  /announcements/images:
    post:
      tags: [Announcements]
      summary: Somewhere to PUT an announcement's image (platform admin, content manager)
      description: |
        Body createAnnouncementImageBodySchema: image/jpeg or image/png, at most 2 MB. Answers an upload
        ticket as POST /reports/uploads does; PUT the bytes, then send fileKey as imageKey.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '201': { description: uploadTicketSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { description: STORAGE_UNAVAILABLE }

  /announcements/audience-count:
    post:
      tags: [Announcements]
      summary: How many people an audience reaches now (platform admin, content manager)
      description: |
        Body audienceCountBodySchema: { audience }, typically the one being edited. Active members of
        clinics in a clinic role who match, a person in two clinics counting once. The same rule the
        slots use.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/PracticeId' }]
      responses:
        '200': { description: audienceCountViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }

  /announcements/slots:
    get:
      tags: [Announcements]
      summary: What this clinic member sees in one placement (doctor, PA, medicine manager)
      description: |
        A list of announcementSlotViewSchema, at most ANNOUNCEMENT_PLACEMENT_LIMITS for the placement
        long: one for today.banner and sidebar.card, any number for inbox.updates. Published, inside
        its window, for this member's audience, not dismissed, under its cap; sponsored ones are left
        out when announcements.sponsored is off. By priority, then newest. X-Location-Id is optional:
        with it, a place in the audience is matched against that location; without, against any
        location the member works at.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: header, name: X-Location-Id, required: false, schema: { type: string } }
        - in: query
          name: placement
          required: true
          schema: { type: string, enum: [today.banner, sidebar.card, inbox.updates] }
      responses:
        '200': { description: 'A list of announcementSlotViewSchema' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /announcements/{id}:
    parameters:
      - { $ref: '#/components/parameters/PracticeId' }
      - { in: path, name: id, required: true, schema: { type: string } }
    get:
      tags: [Announcements]
      summary: One announcement, with its history (platform admin, content manager)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: announcementViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Announcements]
      summary: Edit a draft or a published one (platform admin, content manager)
      description: |
        Body updateAnnouncementBodySchema: only what changes; audience and event are replaced whole.
        Checked as the whole announcement it leaves. A withdrawn one is ANNOUNCEMENT_WRONG_STATUS.
        Editing a published one tells clinic apps (announcements topic); moving its start moves the
        reminders not yet sent.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: announcementViewSchema }
        '400': { description: VALIDATION_ERROR }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: ANNOUNCEMENT_WRONG_STATUS }

  /announcements/{id}/publish:
    post:
      tags: [Announcements]
      summary: Publish a draft (platform admin, content manager)
      description: |
        Only a draft (ANNOUNCEMENT_WRONG_STATUS otherwise, with details.status). One whose window has
        already passed is ANNOUNCEMENT_ENDED. Its medicine and sponsor are checked again.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: announcementViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: ANNOUNCEMENT_WRONG_STATUS or ANNOUNCEMENT_ENDED }

  /announcements/{id}/withdraw:
    post:
      tags: [Announcements]
      summary: Take a published one down for good (platform admin, content manager)
      description: Only a published one. Every reminder not yet sent is cancelled. Registrations are kept.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: announcementViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: ANNOUNCEMENT_WRONG_STATUS }

  /announcements/{id}/stats:
    get:
      tags: [Announcements]
      summary: Totals only - shows, clicks, dismissals, reminders, registrations (platform admin, content manager)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: announcementStatsViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /announcements/{id}/registrations:
    get:
      tags: [Announcements]
      summary: Who registered, in the order they came (platform admin, content manager)
      description: Each is announcementRegistrationViewSchema - name, phone and clinic, given with consent.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: 'A list of announcementRegistrationViewSchema' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /announcements/{id}/registrations.csv:
    get:
      tags: [Announcements]
      summary: The same list as a CSV file for the organiser (platform admin, content manager)
      description: Columns Name, Phone, Clinic, Registered (Pakistan time). Not the JSON envelope.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: The file, as an attachment
          content:
            text/csv: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /announcements/{id}/events:
    post:
      tags: [Announcements]
      summary: What the app did with one it drew - shown, clicked or dismissed (clinic member)
      description: |
        Body announcementEventBodySchema. Send shown when it is actually drawn: maxShows counts those.
        dismissed hides it from this person for good. Answers this person's state.
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/PracticeId' }
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: announcementStateViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: 'NOT_FOUND - a draft, or one meant for others' }
        '409': { description: ANNOUNCEMENT_WITHDRAWN }

  /announcements/{id}/reminder:
    parameters:
      - { $ref: '#/components/parameters/PracticeId' }
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [Announcements]
      summary: Remind me - a day and an hour before it starts (clinic member)
      description: |
        Bell notifications (announcement.reminder), skipping a time already past. Asking twice changes
        nothing. Only a seminar or an event (ANNOUNCEMENT_NOT_AN_EVENT); not a withdrawn one
        (ANNOUNCEMENT_WITHDRAWN), nor one whose window has passed or that has started
        (ANNOUNCEMENT_ENDED).
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: announcementStateViewSchema }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: ANNOUNCEMENT_NOT_AN_EVENT, ANNOUNCEMENT_WITHDRAWN or ANNOUNCEMENT_ENDED }
    delete:
      tags: [Announcements]
      summary: Cancel the reminders not yet sent (clinic member)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: announcementStateViewSchema }
        '404': { $ref: '#/components/responses/NotFound' }

  /announcements/{id}/register:
    parameters:
      - { $ref: '#/components/parameters/PracticeId' }
      - { in: path, name: id, required: true, schema: { type: string } }
    post:
      tags: [Announcements]
      summary: Register, giving the organiser this person's name, phone and clinic (clinic member)
      description: |
        Body registerAnnouncementBodySchema: { consent: true }, and nothing else will do. Registering
        twice changes nothing. The same refusals as a reminder.
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: announcementStateViewSchema }
        '400': { description: VALIDATION_ERROR - consent missing or not true }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: ANNOUNCEMENT_NOT_AN_EVENT, ANNOUNCEMENT_WITHDRAWN or ANNOUNCEMENT_ENDED }
    delete:
      tags: [Announcements]
      summary: Take a registration back; the details are deleted (clinic member)
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: announcementStateViewSchema }
        '404': { $ref: '#/components/responses/NotFound' }
